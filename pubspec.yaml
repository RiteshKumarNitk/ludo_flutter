name: ludo_flutter
description: Offline board games, starting with Ludo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  provider: ^6.1.2
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/fonts/OFL-Baloo2.txt
    - assets/fonts/OFL-Hind.txt

  # Bundled (never fetched at runtime). Baloo 2 is a variable font: weights are
  # selected through FontVariation in core/theme/app_typography.dart.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-Regular.ttf
          weight: 400
        - asset: assets/fonts/Hind-Medium.ttf
          weight: 500
        - asset: assets/fonts/Hind-SemiBold.ttf
          weight: 600
